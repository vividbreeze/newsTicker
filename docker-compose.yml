services:
  app:
    build: .
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-20}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      LLM_MAX_CALLS_PER_DAY: ${LLM_MAX_CALLS_PER_DAY:-300}
      MAX_AGE_HOURS: ${MAX_AGE_HOURS:-48}
      PREFETCH_DETAILS: ${PREFETCH_DETAILS:-1}
      DOMAIN: ${DOMAIN:-localhost}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    # Reverse Proxy mit automatischem HTTPS (Let's Encrypt); HTTP leitet Caddy selbst um
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:3000
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
