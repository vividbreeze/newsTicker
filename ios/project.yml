name: NewsTicker
options:
  bundleIdPrefix: com.vividbreeze
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  NewsTicker:
    type: application
    platform: iOS
    sources: [NewsTicker]
    info:
      path: NewsTicker/Info.plist
      properties:
        CFBundleDisplayName: Ticker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vividbreeze.newsticker
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  NewsTickerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NewsTickerTests]
    dependencies:
      - target: NewsTicker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.vividbreeze.newsticker.tests
schemes:
  NewsTicker:
    build:
      targets:
        NewsTicker: all
    test:
      targets: [NewsTickerTests]
